[project]
name = "deep-tracker"
version = "0.1.0"
description = "Deep Tracker バックエンド: RSS取得・AI要約API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "feedparser>=6.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["deep_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: 実URLへ接続するテスト（通常は除外。`pytest -m network` で実行）"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
